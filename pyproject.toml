[project]
name = "ai-employee-silver"
version = "0.2.0"
description = "Silver tier AI Employee - Gmail watcher with MCP email server"
requires-python = ">=3.13"
dependencies = [
    "watchdog>=4.0.0",
    "python-dotenv>=1.0.0",
    "google-api-python-client>=2.108.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "mcp>=0.9.0",
    "playwright>=1.40.0",
    "pyyaml>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watchers", "scripts", "mcp_servers", "bronze_skills"]

[tool.uv]
dev-dependencies = []
